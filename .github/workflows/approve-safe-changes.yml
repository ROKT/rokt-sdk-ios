name: Approve Safe Changes

on:
  workflow_run:
    workflows:
      - Pull Request
    types:
      - completed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: approve-safe-changes-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    name: Evaluate and approve
    runs-on: ubuntu-latest
    steps:
      # workflow_run executes this trusted default-branch revision, never the PR head.
      - name: Checkout approval policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/safe-change-approval.json
            .github/scripts/evaluate_safe_change.py
          sparse-checkout-cone-mode: false

      - name: Read current pull request metadata
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pull-request.json"
          gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}/files?per_page=100" > "${RUNNER_TEMP}/files.json"
          gh api "repos/${GH_REPO}/git/trees/${EXPECTED_HEAD_SHA}?recursive=1" > "${RUNNER_TEMP}/head-tree.json"

      - name: Evaluate deterministic approval policy
        id: policy
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 .github/scripts/evaluate_safe_change.py \
            --policy .github/safe-change-approval.json \
            --pull-request "${RUNNER_TEMP}/pull-request.json" \
            --files "${RUNNER_TEMP}/files.json" \
            --head-tree "${RUNNER_TEMP}/head-tree.json" \
            --expected-head-sha "${EXPECTED_HEAD_SHA}"

      - name: Record decision
        env:
          ELIGIBLE: ${{ steps.policy.outputs.eligible }}
          REASON: ${{ steps.policy.outputs.reason }}
        run: |
          {
            echo "### Deterministic approval"
            echo
            echo "- Eligible: ${ELIGIBLE}"
            echo "- Reason: ${REASON}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Approve current commit
        if: steps.policy.outputs.eligible == 'true'
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          gh api \
            --method POST \
            "repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews" \
            -f body='Approved automatically after trusted-author, safe-path, bounded-diff, and successful-validation checks.' \
            -f commit_id="${EXPECTED_HEAD_SHA}" \
            -f event=APPROVE
