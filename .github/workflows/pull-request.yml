name: Pull Request

on:
  pull_request:
  push:
    branches:
      - main
      - workstation/*
  # Manual runs against an arbitrary ref, for measuring test flakiness: dispatch the
  # same ref repeatedly and count how many runs come back green. Note that the
  # concurrency group below keys on `github.ref`, so dispatches of one ref supersede
  # each other — run them one at a time.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      root_sdk: ${{ steps.classify.outputs.root_sdk }}
      package: ${{ steps.classify.outputs.package }}
      ui: ${{ steps.classify.outputs.ui }}
      manifest: ${{ steps.classify.outputs.manifest }}
      contract: ${{ steps.classify.outputs.contract }}
      periphery: ${{ steps.classify.outputs.periphery }}
      size: ${{ steps.classify.outputs.size }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              git diff --name-status --diff-filter=ACDMRTUXB "$PR_BASE_SHA...$PR_HEAD_SHA" \
                | .github/scripts/classify-pr-changes.sh \
                | tee -a "$GITHUB_OUTPUT"
              ;;
            push)
              if [[ -z "$PUSH_BASE_SHA" || "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
                .github/scripts/classify-pr-changes.sh --full "push base SHA is unavailable" \
                  | tee -a "$GITHUB_OUTPUT"
              else
                git diff --name-status --diff-filter=ACDMRTUXB "$PUSH_BASE_SHA" "$PUSH_HEAD_SHA" \
                  | .github/scripts/classify-pr-changes.sh \
                  | tee -a "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              .github/scripts/classify-pr-changes.sh --full "manual validation run" \
                | tee -a "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Validate classifier outputs
        env:
          CONTRACT: ${{ steps.classify.outputs.contract }}
          DOCS: ${{ steps.classify.outputs.docs }}
          FULL: ${{ steps.classify.outputs.full }}
          MANIFEST: ${{ steps.classify.outputs.manifest }}
          PACKAGE: ${{ steps.classify.outputs.package }}
          PERIPHERY: ${{ steps.classify.outputs.periphery }}
          ROOT_SDK: ${{ steps.classify.outputs.root_sdk }}
          SIZE: ${{ steps.classify.outputs.size }}
          UI: ${{ steps.classify.outputs.ui }}
        run: |
          set -euo pipefail
          for selection in "$DOCS" "$ROOT_SDK" "$PACKAGE" "$UI" "$MANIFEST" "$CONTRACT" "$PERIPHERY" "$SIZE" "$FULL"; do
            if [[ "$selection" != "true" && "$selection" != "false" ]]; then
              echo "::error::Classifier emitted an invalid boolean: '$selection'."
              exit 1
            fi
          done

      - name: Test change classifier
        run: .github/scripts/test-classify-pr-changes.sh

  load-package-matrix:
    name: Load Packages matrix
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.package == 'true'
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: Packages/matrix.json
          sparse-checkout-cone-mode: false

      - name: Set matrix output
        id: set
        run: |
          echo "matrix=$(jq -c '[.[] | {path: .local_path}]' Packages/matrix.json)" >> "$GITHUB_OUTPUT"

  trunk-check:
    name: Trunk Check
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
        with:
          check-mode: all

  podspec-lint:
    name: Podspec Lint
    runs-on: macos-latest
    needs: [detect-changes, trunk-check]
    if: needs.detect-changes.outputs.manifest == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Lint podspec
        run: pod lib lint Rokt-Widget.podspec --allow-warnings --verbose

  unit-test:
    name: SPM Unit Tests
    runs-on: macos-latest-xlarge
    needs: [detect-changes, trunk-check]
    if: needs.detect-changes.outputs.root_sdk == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme Rokt-Widget \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -retry-tests-on-failure \
            -resultBundlePath TestResult.xcresult

      - name: Install xcresultparser
        if: always()
        run: brew install xcresultparser

      - name: Process coverage report
        if: always()
        run: |
          xcresultparser --output-format cobertura TestResult.xcresult --project-root "$(pwd)" > "coverage.xml"

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResult.xcresult
          path: TestResult.xcresult

  package-unit-tests:
    name: Package SPM Tests (${{ matrix.package.path }})
    runs-on: macos-latest-xlarge
    needs: [detect-changes, trunk-check, load-package-matrix]
    if: needs.detect-changes.outputs.package == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.load-package-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Resolve SPM dependencies
        run: swift package resolve --package-path "${{ matrix.package.path }}"

      - name: Run package unit tests
        run: |
          set -euo pipefail
          PKG_ROOT="${GITHUB_WORKSPACE}/${{ matrix.package.path }}"
          cd "$PKG_ROOT"

          PACKAGE=$(grep -E '^\s*name:' Package.swift | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          LIB_COUNT=$(grep -c '\.library' Package.swift || true)
          if [ "${LIB_COUNT:-0}" -gt 1 ]; then
            SCHEME="${PACKAGE}-Package"
          else
            SCHEME="$PACKAGE"
          fi
          echo "Testing scheme: ${SCHEME} in ${PKG_ROOT}"

          if compgen -G ./*.xcodeproj > /dev/null 2>&1; then
            for xc in ./*.xcodeproj; do
              [ -d "$xc" ] && mv "$xc" "${xc}.bak"
            done
            restore_xcodeproj() {
              for xc in ./*.xcodeproj.bak; do
                [ -d "$xc" ] && mv "$xc" "${xc%.bak}"
              done
            }
            trap restore_xcodeproj EXIT
          fi

          DERIVED="${GITHUB_WORKSPACE}/.derived-data-$(echo "${{ matrix.package.path }}" | tr / -)"
          rm -rf "$DERIVED"
          mkdir -p "$DERIVED"

          # Expose coverage artifacts to later steps before running tests so the
          # upload (if: always()) still has them when tests fail.
          echo "PKG_FLAG=$(basename "${{ matrix.package.path }}")" >> "$GITHUB_ENV"
          echo "PKG_XCRESULT=${DERIVED}/Tests.xcresult" >> "$GITHUB_ENV"

          xcodebuild test \
            -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "${DERIVED}/Tests.xcresult" \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -retry-tests-on-failure \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Install xcresultparser
        if: always()
        run: brew install xcresultparser

      - name: Process coverage report
        if: always()
        run: |
          xcresultparser --output-format cobertura "$PKG_XCRESULT" --project-root "$GITHUB_WORKSPACE" > "package-coverage.xml"

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./package-coverage.xml
          flags: ${{ env.PKG_FLAG }}

  ui-test:
    name: UI Tests
    runs-on: macos-latest-xlarge
    needs: [detect-changes, trunk-check]
    if: needs.detect-changes.outputs.ui == 'true'
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Run UI tests
        # Per-test timeouts bound any single test that hangs on a polling
        # (`toEventually`) assertion, and we do NOT retry on failure here:
        # these UI tests use long polling waits, so retrying every failure up
        # to 3x turns a fast failing run (~6 min) into a >25 min job that GitHub
        # kills as "cancelled" with no result bundle and broken coverage. Failing
        # fast surfaces a real .xcresult and failure list instead of a timeout.
        run: |
          xcodebuild test \
            -project Example/rokt.xcodeproj \
            -scheme rokt-Example-MOCK \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -resultBundlePath UiTestResult.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120

      - name: Install xcresultparser
        if: always()
        run: brew install xcresultparser

      - name: Process coverage report
        if: always()
        run: |
          xcresultparser --output-format cobertura UiTestResult.xcresult --project-root "$(pwd)" > "ui-coverage.xml"

      - name: Upload coverage report
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./ui-coverage.xml
          flags: ui-tests

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UiTestResult.xcresult
          path: UiTestResult.xcresult

  periphery-scan:
    name: Periphery Scan
    runs-on: macos-latest-xlarge
    needs: [detect-changes, trunk-check]
    if: needs.detect-changes.outputs.periphery == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Install Periphery
        run: brew install periphery

      - name: Build Example App
        run: |
          xcodebuild -project "Example/rokt.xcodeproj" -scheme "rokt-Example" -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' -derivedDataPath "DerivedData-periphery" -quiet build CODE_SIGNING_ALLOWED="NO" ENABLE_BITCODE="NO" DEBUG_INFORMATION_FORMAT="dwarf" COMPILER_INDEX_STORE_ENABLE="YES" INDEX_ENABLE_DATA_STORE="YES"

      - name: Run Periphery Scan
        run: periphery scan --format github-actions

  dependency-declaration-check:
    name: Dependency Declaration Check
    runs-on: macos-latest-xlarge
    needs: trunk-check
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Resolve dependencies
        run: swift package resolve

      # Catches a module used through a dependency's public API but never declared
      # in Package.swift. Such a module links in most configurations and only fails
      # for consumers who build each package product as its own dynamic framework.
      - name: Check declared dependencies
        run: ./scripts/check_declared_dependencies.sh "${GITHUB_WORKSPACE}/.derived-data-depcheck"

  size-report:
    name: SDK Size Report
    needs: [detect-changes, trunk-check]
    if: needs.detect-changes.outputs.size == 'true'
    uses: ./.github/workflows/ci-size-report.yml
    permissions:
      contents: read
      pull-requests: write

  pact-validation:
    name: Pact validation
    needs: detect-changes
    if: needs.detect-changes.outputs.contract == 'true'
    uses: ./.github/workflows/pact-consumer.yml
    permissions:
      contents: read

  pact-broker-validation:
    name: Pact broker validation
    needs: [detect-changes, pact-validation]
    if: >
      needs.detect-changes.outputs.contract == 'true' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: pact-publish
    permissions:
      contents: read
    steps:
      - name: Download pact JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pact-json
          path: pacts/

      - name: Publish to pact broker
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          PACT_BRANCH: ${{ github.head_ref }}
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
        run: |
          set -euo pipefail

          if [[ -z "${PACT_BROKER_BASE_URL:-}" || -z "${PACT_BROKER_USERNAME:-}" || -z "${PACT_BROKER_PASSWORD:-}" ]]; then
            echo "::error::Broker credentials are not set." >&2
            exit 1
          fi

          # renovate: datasource=docker depName=pactfoundation/pact-cli
          PACT_CLI_IMAGE="pactfoundation/pact-cli:1.5.0.4@sha256:4708c3d61157bff90082a483e4ff70541eb66f951eb3e218ea3e80a557abd170"
          docker run --rm \
            -v "${PWD}/pacts:/pacts" \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_USERNAME \
            -e PACT_BROKER_PASSWORD \
            "${PACT_CLI_IMAGE}" \
            broker publish /pacts \
              --consumer-app-version "${GITHUB_SHA}" \
              --branch "${PACT_BRANCH}" \
              --tag "forward-looking" \
              --build-url "${BUILD_URL}"

      - name: Check provider verification
        env:
          GITHUB_SHA: ${{ github.sha }}
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
        run: |
          set -euo pipefail
          # renovate: datasource=docker depName=pactfoundation/pact-cli
          PACT_CLI_IMAGE="pactfoundation/pact-cli:1.5.0.4@sha256:4708c3d61157bff90082a483e4ff70541eb66f951eb3e218ea3e80a557abd170"
          docker run --rm \
            -e PACT_BROKER_BASE_URL \
            -e PACT_BROKER_USERNAME \
            -e PACT_BROKER_PASSWORD \
            "${PACT_CLI_IMAGE}" \
            broker can-i-deploy \
              --pacticipant rokt-sdk-ios \
              --version "${GITHUB_SHA}" \
              --to-environment production

  consumer-test-status:
    name: Consumer Test (PactSwift)
    needs: [detect-changes, pact-validation, pact-broker-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check selected Pact validation
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          CONTRACT_SELECTED: ${{ needs.detect-changes.outputs.contract }}
          PACT_RESULT: ${{ needs.pact-validation.result }}
          BROKER_SELECTED: ${{ needs.detect-changes.outputs.contract == 'true' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
          BROKER_RESULT: ${{ needs.pact-broker-validation.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "::error::Change detection did not complete successfully ($DETECT_RESULT)."
            exit 1
          fi

          case "$CONTRACT_SELECTED" in
            true)
              if [[ "$PACT_RESULT" != "success" ]]; then
                echo "::error::Selected Pact validation finished with $PACT_RESULT."
                exit 1
              fi
              ;;
            false)
              if [[ "$PACT_RESULT" != "skipped" ]]; then
                echo "::error::Unselected Pact validation finished with $PACT_RESULT instead of skipped."
                exit 1
              fi
              ;;
            *)
              echo "::error::Contract selector is not a boolean: '$CONTRACT_SELECTED'."
              exit 1
              ;;
          esac

          case "$BROKER_SELECTED" in
            true)
              if [[ "$BROKER_RESULT" != "success" ]]; then
                echo "::error::Selected Pact broker validation finished with $BROKER_RESULT."
                exit 1
              fi
              ;;
            false)
              if [[ "$BROKER_RESULT" != "skipped" ]]; then
                echo "::error::Unselected Pact broker validation finished with $BROKER_RESULT instead of skipped."
                exit 1
              fi
              ;;
            *)
              echo "::error::Pact broker selector is not a boolean: '$BROKER_SELECTED'."
              exit 1
              ;;
          esac

          echo "Pact validation results are appropriate for contract_selected=$CONTRACT_SELECTED and broker_selected=$BROKER_SELECTED."

  pr-gate:
    name: PR Gate
    needs:
      - detect-changes
      - trunk-check
      - podspec-lint
      - unit-test
      - package-unit-tests
      - ui-test
      - periphery-scan
      - size-report
      - consumer-test-status
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          TRUNK_RESULT: ${{ needs.trunk-check.result }}
          MANIFEST_SELECTED: ${{ needs.detect-changes.outputs.manifest }}
          PODSPEC_RESULT: ${{ needs.podspec-lint.result }}
          ROOT_SELECTED: ${{ needs.detect-changes.outputs.root_sdk }}
          ROOT_RESULT: ${{ needs.unit-test.result }}
          PACKAGE_SELECTED: ${{ needs.detect-changes.outputs.package }}
          PACKAGE_RESULT: ${{ needs.package-unit-tests.result }}
          UI_SELECTED: ${{ needs.detect-changes.outputs.ui }}
          UI_RESULT: ${{ needs.ui-test.result }}
          PERIPHERY_SELECTED: ${{ needs.detect-changes.outputs.periphery }}
          PERIPHERY_RESULT: ${{ needs.periphery-scan.result }}
          SIZE_SELECTED: ${{ needs.detect-changes.outputs.size }}
          SIZE_RESULT: ${{ needs.size-report.result }}
          PACT_STATUS_RESULT: ${{ needs.consumer-test-status.result }}
        run: |
          set -euo pipefail

          failed=false
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name finished with $result."
              failed=true
            else
              echo "$name succeeded."
            fi
          }

          require_selected_result() {
            local name="$1"
            local selected="$2"
            local result="$3"

            case "$selected" in
              true)
                require_success "$name" "$result"
                ;;
              false)
                if [[ "$result" != "skipped" ]]; then
                  echo "::error::$name was not selected but finished with $result."
                  failed=true
                else
                  echo "$name was intentionally skipped."
                fi
                ;;
              *)
                echo "::error::$name selector is not a boolean: '$selected'."
                failed=true
                ;;
            esac
          }

          require_success "Change detection" "$DETECT_RESULT"
          require_success "Trunk Check" "$TRUNK_RESULT"
          require_selected_result "Podspec Lint" "$MANIFEST_SELECTED" "$PODSPEC_RESULT"
          require_selected_result "SPM Unit Tests" "$ROOT_SELECTED" "$ROOT_RESULT"
          require_selected_result "Package SPM Tests" "$PACKAGE_SELECTED" "$PACKAGE_RESULT"
          require_selected_result "UI Tests" "$UI_SELECTED" "$UI_RESULT"
          require_selected_result "Periphery Scan" "$PERIPHERY_SELECTED" "$PERIPHERY_RESULT"
          require_selected_result "SDK Size Report" "$SIZE_SELECTED" "$SIZE_RESULT"
          require_success "Consumer Test compatibility status" "$PACT_STATUS_RESULT"

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  pr-notify:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      needs.pr-gate.result == 'success'
    name: Notify GChat
    needs: pr-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Google Chat notification
        continue-on-error: true
        uses: SimonScholz/google-chat-action@3b3519e5102dba8aa5046fd711c4b553586409bb # v1.1.0
        with:
          webhookUrl: ${{ secrets.GCHAT_PRS_MOBILE_INTEGRATION_CHANNEL_WEBHOOK }}
          title: PR Created - ${{ github.event.pull_request.title }}
          imageUrl: ${{ github.event.pull_request.user.avatar_url }}
          threadKey: ${{ github.repository }}-${{ github.event.pull_request.number }}
